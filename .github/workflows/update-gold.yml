# heysep/miniapp-data 의 .github/workflows/update-gold.yml 로 옮긴다.
# 스크립트는 gold/fetch-gold.mjs 로 옮긴다(출력: gold/gold.json, 스크립트 옆).
name: Update gold price

on:
  schedule:
    # KRX 금시장 09:00~15:30 KST = 00:00~06:30 UTC. 평일 장중 매시 정각 + 장 마감 후 1회.
    - cron: '5 0-6 * * 1-5' # 장중 1시간마다 (KST 09:05~15:05)
    - cron: '45 6 * * 1-5' # 장 마감 후 (KST 15:45) — 종가 확정
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: miniapp-data-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch latest gold price
        run: node gold/fetch-gold.mjs
      - name: Commit & push if changed
        run: |
          # 첫 실행에는 gold.json 이 추적 전 파일이라 `git diff --quiet` 가 「변경 없음」으로 본다.
          # 먼저 add 하고 staged 기준으로 비교한다.
          git add gold/gold.json
          if git diff --cached --quiet -- gold/gold.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: gold auto-update ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase -q && git push
